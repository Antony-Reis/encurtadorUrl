spring:
  application:
    name: encurtador
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  kafka:
    bootstrap-servers:
      - localhost:9092
  data:
    redis:
      host: localhost
      password: ${REDIS_PASSWORD}
      port: 6379


jwt:
  secret: ${SECURITY_KEY}
  expiration: 9000

server:
  port: 9090